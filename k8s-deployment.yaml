apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-migration-dashboard
  labels:
    app: vm-migration-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-migration-dashboard
  template:
    metadata:
      labels:
        app: vm-migration-dashboard
    spec:
      containers:
      - name: dashboard
        image: vm-migration-dashboard:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: vm-migration-dashboard-service
  labels:
    app: vm-migration-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: vm-migration-dashboard
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vm-migration-dashboard-route
  labels:
    app: vm-migration-dashboard
spec:
  to:
    kind: Service
    name: vm-migration-dashboard-service
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect